version: '3.8'

services:
  nginx:
    image: nginxproxy/nginx-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - /var/run/docker.sock:/tmp/docker.sock:ro

  postgres:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ieeecusb}
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: always
    volumes:
      - redis_data:/data

  minio:
    image: quay.io/minio/minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-admin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-admin12345}
      VIRTUAL_HOST: storage.ieeecusb.org
      VIRTUAL_PORT: 9000
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-create-bucket:
    image: quay.io/minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      /usr/bin/mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER:-admin} ${MINIO_ROOT_PASSWORD:-admin12345};
      /usr/bin/mc ls myminio/${BB_BUCKET_NAME:-ieee-storage} > /dev/null 2>&1 || (
        /usr/bin/mc mb myminio/${BB_BUCKET_NAME:-ieee-storage} &&
        /usr/bin/mc anonymous set public myminio/${BB_BUCKET_NAME:-ieee-storage}
      );
      exit 0;
      "

  backend:
    build: .
    restart: always
    environment:
      - VIRTUAL_HOST=api.ieeecusb.org
      - VIRTUAL_PORT=3000
      - DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@postgres:5432/${POSTGRES_DB:-ieeecusb}}
      - REDIS_URL=redis://redis:6379
      - BB_ENDPOINT=${BB_ENDPOINT:-https://storage.ieeecusb.org}
      - BB_ACCESS_KEY_ID=${MINIO_ROOT_USER:-admin}
      - BB_SECRET_ACCESS_KEY=${MINIO_ROOT_PASSWORD:-admin12345}
      - BB_BUCKET_NAME=${BB_BUCKET_NAME:-ieee-storage}
      - BB_REGION=us-east-1
    env_file:
      - .env
    depends_on:
      - postgres
      - redis
      - minio

volumes:
  postgres_data:
  redis_data:
  minio_data:
